[project]
name = "mcs-analysis"
version = "0.1.0"
description = "Analysis of the measurement campaigns of mcs-pipeline"
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "jsonschema==4.26.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false
# Cooldown: only releases uploaded to PyPI before this date are resolved.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
