[project]
name = "mcs-harness"
version = "0.1.0"
description = "Orchestrator of the measurement campaigns of mcs-pipeline"
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "certifi==2026.7.22",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
